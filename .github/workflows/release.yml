name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: avizor
          POSTGRES_PASSWORD: avizor
          POSTGRES_DB: avizor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U avizor -d avizor"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://avizor:avizor@localhost:5432/avizor
      JWT_SECRET: ci-secret-not-for-production-0123456789abcdef
      PHONE_HMAC_KEY: ci-hmac-key-not-for-production-0123456789
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Lint & format
        run: |
          ruff check backend
          ruff format --check backend

      - name: Apply database migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Run backend tests
        run: pytest backend/tests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Mobile lint & type-check
        working-directory: mobile
        run: |
          npm run lint
          npm run type-check

  build-release:
    name: Build & publish APK
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > /tmp/avizor-release.keystore

      - name: Make gradlew executable
        run: chmod +x mobile/android/gradlew

      - name: Build release APK
        working-directory: mobile/android
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          KEYSTORE_PATH: /tmp/avizor-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: mv mobile/android/app/build/outputs/apk/release/app-release.apk avizor.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: avizor.apk
          generate_release_notes: true
