<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Recupera el acceso a tu cuenta de Avizor" />
  <title>Recuperar contraseña - Avizor</title>
  <link rel="stylesheet" href="{{ url_for('web_static', path='css/main.css') }}" />
  <style>
    body { background: var(--color-background); }

    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .auth-card { width: 100%; max-width: 420px; }

    .auth-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 2rem;
      text-decoration: none;
    }
    .auth-brand img { height: 36px; width: auto; }
    .auth-brand-name {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 400;
      font-style: italic;
      color: var(--color-primary);
    }

    .auth-heading {
      font-family: var(--font-display);
      font-size: clamp(1.5rem, 4vw, 1.9rem);
      font-weight: 300;
      color: var(--color-primary);
      text-align: center;
      margin-bottom: 0.375rem;
      line-height: 1.2;
    }
    .auth-sub {
      text-align: center;
      color: var(--color-text-muted);
      font-size: var(--font-size-sm);
      margin-bottom: 2rem;
    }

    .alert {
      padding: 0.75rem 1rem;
      border-radius: var(--radius-sm);
      font-size: var(--font-size-sm);
      margin-bottom: 1rem;
      display: none;
    }
    .alert--error   { background: #fde8e8; color: var(--color-alert);   border: 1px solid #fca5a5; }
    .alert--success { background: #d1f0de; color: var(--color-success); border: 1px solid #a8d9b8; }
    .alert--visible { display: block; }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      margin-bottom: 1rem;
    }
    .form-label { font-size: var(--font-size-sm); font-weight: 600; color: var(--color-text); }
    .form-input {
      width: 100%;
      padding: 0.625rem 0.875rem;
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-sm);
      font-family: var(--font-family);
      font-size: var(--font-size-base);
      color: var(--color-text);
      background: var(--color-white);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .form-input:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(22, 78, 85, 0.1);
    }
    .form-input--error { border-color: var(--color-alert); }
    .form-error { font-size: 0.8125rem; color: var(--color-alert); display: none; }
    .form-error--visible { display: block; }

    .btn-submit {
      width: 100%;
      padding: 0.75rem;
      background: var(--color-primary);
      color: var(--color-white);
      border: none;
      border-radius: var(--radius-sm);
      font-family: var(--font-family);
      font-size: var(--font-size-base);
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.15s;
    }
    .btn-submit:hover    { background: var(--color-primary-light); }
    .btn-submit:disabled { opacity: 0.65; cursor: not-allowed; }

    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: var(--font-size-sm);
      color: var(--color-text-muted);
    }
    .auth-footer a { color: var(--color-primary); font-weight: 600; }

    .auth-back {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: var(--font-size-sm);
      color: var(--color-text-muted);
      text-decoration: none;
      margin-bottom: 1.5rem;
      transition: color 0.15s;
    }
    .auth-back:hover { color: var(--color-primary); }
    .auth-back svg { width: 0.875rem; height: 0.875rem; }
  </style>
</head>
<body>

  <div class="auth-page">
    <div class="auth-card card">

      <a href="{{ url_for('login_page') }}" class="auth-back">
        <i data-lucide="arrow-left" aria-hidden="true"></i>
        Volver al inicio de sesión
      </a>

      <a href="{{ url_for('login_page') }}" class="auth-brand">
        <img src="{{ url_for('web_static', path='img/logo-web.png') }}" alt="">
        <span class="auth-brand-name">Avizor</span>
      </a>

      <h1 class="auth-heading">Recuperar contraseña</h1>
      <p class="auth-sub">Introduce tu email y te enviaremos un enlace para crear una nueva contraseña.</p>

      <div class="alert alert--error"   id="alert-error"   aria-live="polite" aria-atomic="true"></div>
      <div class="alert alert--success" id="alert-success" aria-live="polite" aria-atomic="true"></div>

      <form id="forgot-form" novalidate>

        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input
            class="form-input"
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            placeholder="correo@ejemplo.com"
            maxlength="254"
            required
          >
          <span class="form-error" id="err-email"></span>
        </div>

        <button type="submit" class="btn-submit" id="submit-btn">Enviar enlace</button>

      </form>

      <p class="auth-footer">
        ¿Recordaste tu contraseña? <a href="{{ url_for('login_page') }}">Inicia sesión</a>
      </p>

    </div>
  </div>

  <script src="{{ url_for('web_static', path='js/lucide.min.js') }}"></script>
  <script>
    lucide.createIcons();

    document.getElementById('forgot-form').addEventListener('submit', async e => {
      e.preventDefault();

      const email  = document.getElementById('email').value.trim();
      const errEl  = document.getElementById('err-email');
      const alertE = document.getElementById('alert-error');
      const alertS = document.getElementById('alert-success');

      errEl.textContent = '';
      errEl.classList.remove('form-error--visible');
      document.getElementById('email').classList.remove('form-input--error');
      alertE.classList.remove('alert--visible');
      alertS.classList.remove('alert--visible');

      if (!email || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
        document.getElementById('email').classList.add('form-input--error');
        errEl.textContent = 'Introduce un email válido.';
        errEl.classList.add('form-error--visible');
        return;
      }

      const btn = document.getElementById('submit-btn');
      btn.disabled    = true;
      btn.textContent = 'Enviando…';

      try {
        await fetch('/api/v1/auth/forgot-password', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ email }),
        });
        // Siempre mostramos el mismo mensaje (el backend tampoco confirma si el email existe)
        document.getElementById('forgot-form').style.display = 'none';
        alertS.textContent = 'Si la cuenta existe, recibirás un correo en breve. Revisa tu bandeja de entrada.';
        alertS.classList.add('alert--visible');
      } catch {
        alertE.textContent = 'Error de conexión. Comprueba tu red e inténtalo de nuevo.';
        alertE.classList.add('alert--visible');
        btn.disabled    = false;
        btn.textContent = 'Enviar enlace';
      }
    });
  </script>
</body>
</html>
