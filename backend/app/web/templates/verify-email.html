<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Verifica tu email para activar tu cuenta de Avizor" />
  <title>Verificar email - Avizor</title>
  <link rel="stylesheet" href="{{ url_for('web_static', path='css/main.css') }}" />
  <style>
    body { background: var(--color-background); }

    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .auth-card { width: 100%; max-width: 420px; }

    .auth-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 2rem;
      text-decoration: none;
    }
    .auth-brand img { height: 36px; width: auto; }
    .auth-brand-name {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 400;
      font-style: italic;
      color: var(--color-primary);
    }

    .auth-heading {
      font-family: var(--font-display);
      font-size: clamp(1.5rem, 4vw, 1.9rem);
      font-weight: 300;
      color: var(--color-primary);
      text-align: center;
      margin-bottom: 0.375rem;
      line-height: 1.2;
    }
    .auth-sub {
      text-align: center;
      color: var(--color-text-muted);
      font-size: var(--font-size-sm);
      margin-bottom: 2rem;
    }
    .auth-email {
      font-weight: 600;
      color: var(--color-text);
    }

    .alert {
      padding: 0.75rem 1rem;
      border-radius: var(--radius-sm);
      font-size: var(--font-size-sm);
      margin-bottom: 1rem;
      display: none;
    }
    .alert--error   { background: #fde8e8; color: var(--color-alert);   border: 1px solid #fca5a5; }
    .alert--success { background: #d1f0de; color: var(--color-success); border: 1px solid #a8d9b8; }
    .alert--visible { display: block; }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      margin-bottom: 1rem;
    }
    .form-label { font-size: var(--font-size-sm); font-weight: 600; color: var(--color-text); }
    .form-input {
      width: 100%;
      padding: 0.625rem 0.875rem;
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-sm);
      font-family: var(--font-family);
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--color-text);
      background: var(--color-white);
      outline: none;
      text-align: center;
      letter-spacing: 0.5em;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .form-input:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(22, 78, 85, 0.1);
    }
    .form-input--error { border-color: var(--color-alert); }
    .form-error { font-size: 0.8125rem; color: var(--color-alert); display: none; }
    .form-error--visible { display: block; }

    .btn-submit {
      width: 100%;
      padding: 0.75rem;
      background: var(--color-primary);
      color: var(--color-white);
      border: none;
      border-radius: var(--radius-sm);
      font-family: var(--font-family);
      font-size: var(--font-size-base);
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.15s;
    }
    .btn-submit:hover    { background: var(--color-primary-light); }
    .btn-submit:disabled { opacity: 0.65; cursor: not-allowed; }

    .resend-row {
      text-align: center;
      margin-top: 1.25rem;
      font-size: var(--font-size-sm);
      color: var(--color-text-muted);
    }
    .btn-resend {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--color-primary);
      font-weight: 600;
      font-size: var(--font-size-sm);
      font-family: var(--font-family);
      padding: 0;
      text-decoration: underline;
    }
    .btn-resend:disabled { opacity: 0.5; cursor: not-allowed; text-decoration: none; }

    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: var(--font-size-sm);
      color: var(--color-text-muted);
    }
    .auth-footer a { color: var(--color-primary); font-weight: 600; }
  </style>
</head>
<body>

  <div class="auth-page">
    <div class="auth-card card">

      <a href="{{ url_for('login_page') }}" class="auth-brand">
        <img src="{{ url_for('web_static', path='img/logo-web.png') }}" alt="">
        <span class="auth-brand-name">Avizor</span>
      </a>

      <h1 class="auth-heading">Verifica tu email</h1>
      <p class="auth-sub" id="auth-sub">
        Hemos enviado un código de 6 dígitos a<br>
        <span class="auth-email" id="email-display"></span>
      </p>

      <div class="alert alert--error"   id="alert-error"   aria-live="polite" aria-atomic="true"></div>
      <div class="alert alert--success" id="alert-success" aria-live="polite" aria-atomic="true"></div>

      <form id="verify-form" novalidate>

        <div class="form-group">
          <label class="form-label" for="code">Código de verificación</label>
          <input
            class="form-input"
            type="text"
            id="code"
            name="code"
            inputmode="numeric"
            autocomplete="one-time-code"
            placeholder="000000"
            maxlength="6"
            required
          >
          <span class="form-error" id="err-code"></span>
        </div>

        <button type="submit" class="btn-submit" id="submit-btn">Verificar</button>

      </form>

      <div class="resend-row">
        ¿No recibiste el código?
        <button class="btn-resend" id="resend-btn" type="button">Reenviar</button>
      </div>

      <p class="auth-footer">
        <a href="{{ url_for('login_page') }}">Volver al inicio de sesión</a>
      </p>

    </div>
  </div>

  <script src="{{ url_for('web_static', path='js/lucide.min.js') }}"></script>
  <script>
    lucide.createIcons();

    const params = new URLSearchParams(window.location.search);
    const email  = params.get('email') || '';

    document.getElementById('email-display').textContent = email;

    // Only allow digits
    document.getElementById('code').addEventListener('input', e => {
      e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
    });

    document.getElementById('verify-form').addEventListener('submit', async e => {
      e.preventDefault();

      const code    = document.getElementById('code').value.trim();
      const errEl   = document.getElementById('err-code');
      const alertE  = document.getElementById('alert-error');
      const alertS  = document.getElementById('alert-success');

      errEl.textContent = '';
      errEl.classList.remove('form-error--visible');
      document.getElementById('code').classList.remove('form-input--error');
      alertE.classList.remove('alert--visible');
      alertS.classList.remove('alert--visible');

      if (!/^\d{6}$/.test(code)) {
        document.getElementById('code').classList.add('form-input--error');
        errEl.textContent = 'El código debe tener exactamente 6 dígitos.';
        errEl.classList.add('form-error--visible');
        return;
      }

      const btn = document.getElementById('submit-btn');
      btn.disabled    = true;
      btn.textContent = 'Verificando…';

      try {
        const res = await fetch('/api/v1/auth/verify-email', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ email, code }),
        });

        if (res.ok || res.status === 204) {
          document.getElementById('verify-form').style.display = 'none';
          document.getElementById('resend-btn').closest('.resend-row').style.display = 'none';
          alertS.innerHTML = '¡Email verificado! <a href="/login?email=' + encodeURIComponent(email) + '" style="color:inherit;font-weight:700;">Inicia sesión</a> para continuar.';
          alertS.classList.add('alert--visible');
        } else {
          const data = await res.json().catch(() => ({}));
          alertE.textContent = data.detail ?? 'Código incorrecto o expirado.';
          alertE.classList.add('alert--visible');
          btn.disabled    = false;
          btn.textContent = 'Verificar';
        }
      } catch {
        alertE.textContent = 'Error de conexión. Comprueba tu red e inténtalo de nuevo.';
        alertE.classList.add('alert--visible');
        btn.disabled    = false;
        btn.textContent = 'Verificar';
      }
    });

    document.getElementById('resend-btn').addEventListener('click', async () => {
      const alertE  = document.getElementById('alert-error');
      const alertS  = document.getElementById('alert-success');
      alertE.classList.remove('alert--visible');
      alertS.classList.remove('alert--visible');

      const btn = document.getElementById('resend-btn');
      btn.disabled    = true;
      btn.textContent = 'Enviando…';

      try {
        await fetch('/api/v1/auth/resend-verification', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ email }),
        });
        alertS.textContent = 'Código reenviado. Revisa tu bandeja de entrada.';
        alertS.classList.add('alert--visible');
      } catch {
        alertE.textContent = 'Error al reenviar. Inténtalo de nuevo.';
        alertE.classList.add('alert--visible');
      }

      setTimeout(() => { btn.disabled = false; btn.textContent = 'Reenviar'; }, 30000);
    });
  </script>
</body>
</html>
