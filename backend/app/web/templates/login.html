<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Inicia sesión en Avizor" />
  <title>Iniciar sesión — Avizor</title>
  <link rel="preconnect" href="https://unpkg.com" />
  <link rel="stylesheet" href="{{ url_for('web_static', path='css/main.css') }}" />
  <style>
    body { background: var(--color-background); }

    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
    }

    .auth-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 2rem;
      text-decoration: none;
    }
    .auth-brand img { height: 36px; width: auto; }
    .auth-brand-name {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 400;
      font-style: italic;
      color: var(--color-primary);
    }

    .auth-heading {
      font-family: var(--font-display);
      font-size: clamp(1.5rem, 4vw, 1.9rem);
      font-weight: 300;
      color: var(--color-primary);
      text-align: center;
      margin-bottom: 0.375rem;
      line-height: 1.2;
    }
    .auth-sub {
      text-align: center;
      color: var(--color-text-muted);
      font-size: var(--font-size-sm);
      margin-bottom: 2rem;
    }

    .alert {
      padding: 0.75rem 1rem;
      border-radius: var(--radius-sm);
      font-size: var(--font-size-sm);
      margin-bottom: 1rem;
      display: none;
    }
    .alert--error   { background: #fde8e8; color: var(--color-alert);   border: 1px solid #fca5a5; }
    .alert--success { background: #d1f0de; color: var(--color-success); border: 1px solid #a8d9b8; }
    .alert--visible { display: block; }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      margin-bottom: 1rem;
    }
    .form-label {
      font-size: var(--font-size-sm);
      font-weight: 600;
      color: var(--color-text);
    }
    .input-wrap { position: relative; }
    .form-input {
      width: 100%;
      padding: 0.625rem 0.875rem;
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-sm);
      font-family: var(--font-family);
      font-size: var(--font-size-base);
      color: var(--color-text);
      background: var(--color-white);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .form-input:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(22, 78, 85, 0.1);
    }
    .form-input--error { border-color: var(--color-alert); }
    .input-wrap .form-input { padding-right: 2.5rem; }

    .toggle-pw {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--color-text-muted);
      padding: 0;
      display: flex;
      align-items: center;
    }
    .toggle-pw:hover { color: var(--color-primary); }
    .toggle-pw svg { width: 1rem; height: 1rem; }

    .form-error { font-size: 0.8125rem; color: var(--color-alert); display: none; }
    .form-error--visible { display: block; }

    .btn-submit {
      width: 100%;
      padding: 0.75rem;
      background: var(--color-primary);
      color: var(--color-white);
      border: none;
      border-radius: var(--radius-sm);
      font-family: var(--font-family);
      font-size: var(--font-size-base);
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.15s;
    }
    .btn-submit:hover    { background: var(--color-primary-light); }
    .btn-submit:disabled { opacity: 0.65; cursor: not-allowed; }

    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: var(--font-size-sm);
      color: var(--color-text-muted);
    }
    .auth-footer a { color: var(--color-primary); font-weight: 600; }

    .auth-back {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: var(--font-size-sm);
      color: var(--color-text-muted);
      text-decoration: none;
      margin-bottom: 1.5rem;
      transition: color 0.15s;
    }
    .auth-back:hover { color: var(--color-primary); text-decoration: none; }
    .auth-back svg { width: 0.875rem; height: 0.875rem; }
  </style>
</head>
<body>

  <div class="auth-page">
    <div class="auth-card card">

      <a href="{{ url_for('dashboard') }}" class="auth-back">
        <i data-lucide="arrow-left" aria-hidden="true"></i>
        Volver al inicio
      </a>

      <a href="{{ url_for('dashboard') }}" class="auth-brand">
        <img src="{{ url_for('web_static', path='img/logo-web.png') }}" alt="">
        <span class="auth-brand-name">Avizor</span>
      </a>

      <h1 class="auth-heading">Bienvenido de nuevo</h1>
      <p class="auth-sub">Inicia sesión para acceder al panel de Tutor.</p>

      <div class="alert alert--error" id="alert-error"></div>

      <form id="login-form" novalidate>

        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input
            class="form-input"
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            placeholder="correo@ejemplo.com"
            maxlength="254"
            required
          >
          <span class="form-error" id="err-email"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Contraseña</label>
          <div class="input-wrap">
            <input
              class="form-input"
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              placeholder="Tu contraseña"
              maxlength="128"
              required
            >
            <button type="button" class="toggle-pw" aria-label="Mostrar contraseña" data-target="password">
              <i data-lucide="eye" aria-hidden="true"></i>
            </button>
          </div>
          <span class="form-error" id="err-password"></span>
        </div>

        <button type="submit" class="btn-submit" id="submit-btn">Iniciar sesión</button>

      </form>

      <p class="auth-footer">
        ¿No tienes cuenta? <a href="/register">Regístrate</a>
      </p>

    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>
    lucide.createIcons();

    document.querySelectorAll('.toggle-pw').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = document.getElementById(btn.dataset.target);
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        btn.setAttribute('aria-label', show ? 'Ocultar contraseña' : 'Mostrar contraseña');
        btn.innerHTML = show
          ? '<i data-lucide="eye-off" aria-hidden="true"></i>'
          : '<i data-lucide="eye" aria-hidden="true"></i>';
        lucide.createIcons();
      });
    });

    function clearErrors() {
      document.querySelectorAll('.form-error').forEach(el => {
        el.textContent = '';
        el.classList.remove('form-error--visible');
      });
      document.querySelectorAll('.form-input').forEach(el => {
        el.classList.remove('form-input--error');
      });
      document.getElementById('alert-error').classList.remove('alert--visible');
    }

    function markInvalid(inputId, errorId, msg) {
      document.getElementById(inputId).classList.add('form-input--error');
      const el = document.getElementById(errorId);
      el.textContent = msg;
      el.classList.add('form-error--visible');
    }

    document.getElementById('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      clearErrors();

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      let valid = true;

      if (!email || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
        markInvalid('email', 'err-email', 'Introduce un email válido.');
        valid = false;
      }
      if (!password) {
        markInvalid('password', 'err-password', 'Introduce tu contraseña.');
        valid = false;
      }

      if (!valid) return;

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = 'Entrando…';

      try {
        const res = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });

        if (res.ok) {
          const data = await res.json();
          localStorage.setItem('avizor_token', data.access_token);
          window.location.href = '/';
        } else {
          const data = await res.json().catch(() => ({}));
          const alertEl = document.getElementById('alert-error');
          alertEl.textContent = data.detail ?? 'Email o contraseña incorrectos.';
          alertEl.classList.add('alert--visible');
          btn.disabled = false;
          btn.textContent = 'Iniciar sesión';
        }
      } catch {
        const alertEl = document.getElementById('alert-error');
        alertEl.textContent = 'Error de conexión. Comprueba tu red e inténtalo de nuevo.';
        alertEl.classList.add('alert--visible');
        btn.disabled = false;
        btn.textContent = 'Iniciar sesión';
      }
    });
  </script>
</body>
</html>
