<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Restablece tu contraseña de Avizor" />
  <title>Nueva contraseña - Avizor</title>
  <link rel="stylesheet" href="{{ url_for('web_static', path='css/main.css') }}" />
  <style>
    body { background: var(--color-background); }

    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .auth-card { width: 100%; max-width: 420px; }

    .auth-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 2rem;
      text-decoration: none;
    }
    .auth-brand img { height: 36px; width: auto; }
    .auth-brand-name {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 400;
      font-style: italic;
      color: var(--color-primary);
    }

    .auth-heading {
      font-family: var(--font-display);
      font-size: clamp(1.5rem, 4vw, 1.9rem);
      font-weight: 300;
      color: var(--color-primary);
      text-align: center;
      margin-bottom: 0.375rem;
      line-height: 1.2;
    }
    .auth-sub {
      text-align: center;
      color: var(--color-text-muted);
      font-size: var(--font-size-sm);
      margin-bottom: 2rem;
    }

    .alert {
      padding: 0.75rem 1rem;
      border-radius: var(--radius-sm);
      font-size: var(--font-size-sm);
      margin-bottom: 1rem;
      display: none;
    }
    .alert--error   { background: #fde8e8; color: var(--color-alert);   border: 1px solid #fca5a5; }
    .alert--success { background: #d1f0de; color: var(--color-success); border: 1px solid #a8d9b8; }
    .alert--visible { display: block; }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      margin-bottom: 1rem;
    }
    .form-label { font-size: var(--font-size-sm); font-weight: 600; color: var(--color-text); }
    .input-wrap { position: relative; }
    .form-input {
      width: 100%;
      padding: 0.625rem 0.875rem;
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-sm);
      font-family: var(--font-family);
      font-size: var(--font-size-base);
      color: var(--color-text);
      background: var(--color-white);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .form-input:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(22, 78, 85, 0.1);
    }
    .form-input--error { border-color: var(--color-alert); }
    .input-wrap .form-input { padding-right: 2.5rem; }

    .toggle-pw {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--color-text-muted);
      padding: 0;
      display: flex;
      align-items: center;
    }
    .toggle-pw:hover { color: var(--color-primary); }
    .toggle-pw svg { width: 1rem; height: 1rem; }

    .form-error { font-size: 0.8125rem; color: var(--color-alert); display: none; }
    .form-error--visible { display: block; }

    .btn-submit {
      width: 100%;
      padding: 0.75rem;
      background: var(--color-primary);
      color: var(--color-white);
      border: none;
      border-radius: var(--radius-sm);
      font-family: var(--font-family);
      font-size: var(--font-size-base);
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.15s;
    }
    .btn-submit:hover    { background: var(--color-primary-light); }
    .btn-submit:disabled { opacity: 0.65; cursor: not-allowed; }

    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: var(--font-size-sm);
      color: var(--color-text-muted);
    }
    .auth-footer a { color: var(--color-primary); font-weight: 600; }

    .invalid-token {
      text-align: center;
      padding: 2rem 0;
    }
    .invalid-token p {
      color: var(--color-text-muted);
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>

  <div class="auth-page">
    <div class="auth-card card">

      <a href="{{ url_for('login_page') }}" class="auth-brand">
        <img src="{{ url_for('web_static', path='img/logo-web.png') }}" alt="">
        <span class="auth-brand-name">Avizor</span>
      </a>

      <div id="form-view">
        <h1 class="auth-heading">Nueva contraseña</h1>
        <p class="auth-sub">Elige una contraseña segura de al menos 10 caracteres.</p>

        <div class="alert alert--error"   id="alert-error"   aria-live="polite" aria-atomic="true"></div>
        <div class="alert alert--success" id="alert-success" aria-live="polite" aria-atomic="true"></div>

        <form id="reset-form" novalidate>

          <div class="form-group">
            <label class="form-label" for="password">Nueva contraseña</label>
            <div class="input-wrap">
              <input
                class="form-input"
                type="password"
                id="password"
                name="password"
                autocomplete="new-password"
                placeholder="Mínimo 10 caracteres"
                minlength="10"
                maxlength="128"
                required
              >
              <button type="button" class="toggle-pw" aria-label="Mostrar contraseña" data-target="password">
                <i data-lucide="eye" aria-hidden="true"></i>
              </button>
            </div>
            <span class="form-error" id="err-password"></span>
          </div>

          <div class="form-group">
            <label class="form-label" for="confirm">Confirmar contraseña</label>
            <div class="input-wrap">
              <input
                class="form-input"
                type="password"
                id="confirm"
                name="confirm"
                autocomplete="new-password"
                placeholder="Repite la contraseña"
                maxlength="128"
                required
              >
              <button type="button" class="toggle-pw" aria-label="Mostrar contraseña" data-target="confirm">
                <i data-lucide="eye" aria-hidden="true"></i>
              </button>
            </div>
            <span class="form-error" id="err-confirm"></span>
          </div>

          <button type="submit" class="btn-submit" id="submit-btn">Guardar contraseña</button>

        </form>
      </div>

      <div id="invalid-view" class="invalid-token" style="display:none">
        <p>Este enlace no es válido o ha caducado.<br>Solicita uno nuevo desde la app.</p>
        <a href="{{ url_for('login_page') }}" class="btn-submit" style="display:inline-block;text-decoration:none;text-align:center;">
          Ir al inicio de sesión
        </a>
      </div>

      <p class="auth-footer">
        ¿Recordaste tu contraseña? <a href="{{ url_for('login_page') }}">Inicia sesión</a>
      </p>

    </div>
  </div>

  <script src="{{ url_for('web_static', path='js/lucide.min.js') }}"></script>
  <script>
    lucide.createIcons();

    const params = new URLSearchParams(window.location.search);
    const token  = params.get('token');

    if (!token) {
      document.getElementById('form-view').style.display    = 'none';
      document.getElementById('invalid-view').style.display = 'block';
    } else {
      history.replaceState(null, '', '/reset-password');
    }

    document.querySelectorAll('.toggle-pw').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = document.getElementById(btn.dataset.target);
        const show  = input.type === 'password';
        input.type  = show ? 'text' : 'password';
        btn.setAttribute('aria-label', show ? 'Ocultar contraseña' : 'Mostrar contraseña');
        btn.innerHTML = show
          ? '<i data-lucide="eye-off" aria-hidden="true"></i>'
          : '<i data-lucide="eye"     aria-hidden="true"></i>';
        lucide.createIcons();
      });
    });

    function clearErrors() {
      document.querySelectorAll('.form-error').forEach(el => {
        el.textContent = '';
        el.classList.remove('form-error--visible');
      });
      document.querySelectorAll('.form-input').forEach(el => el.classList.remove('form-input--error'));
      document.getElementById('alert-error').classList.remove('alert--visible');
      document.getElementById('alert-success').classList.remove('alert--visible');
    }

    function markInvalid(inputId, errorId, msg) {
      document.getElementById(inputId).classList.add('form-input--error');
      const el = document.getElementById(errorId);
      el.textContent = msg;
      el.classList.add('form-error--visible');
    }

    document.getElementById('reset-form').addEventListener('submit', async e => {
      e.preventDefault();
      clearErrors();

      const password = document.getElementById('password').value;
      const confirm  = document.getElementById('confirm').value;
      let valid = true;

      if (password.length < 10) {
        markInvalid('password', 'err-password', 'La contraseña debe tener al menos 10 caracteres.');
        valid = false;
      }
      if (password !== confirm) {
        markInvalid('confirm', 'err-confirm', 'Las contraseñas no coinciden.');
        valid = false;
      }
      if (!valid) return;

      const btn = document.getElementById('submit-btn');
      btn.disabled    = true;
      btn.textContent = 'Guardando…';

      try {
        const res = await fetch('/api/v1/auth/reset-password', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ token, new_password: password }),
        });

        if (res.ok || res.status === 204) {
          const successEl = document.getElementById('alert-success');
          successEl.textContent = 'Contraseña actualizada. Ya puedes iniciar sesión.';
          successEl.classList.add('alert--visible');
          document.getElementById('reset-form').style.display = 'none';
        } else {
          const data    = await res.json().catch(() => ({}));
          const errorEl = document.getElementById('alert-error');
          errorEl.textContent = data.detail ?? 'El enlace no es válido o ha caducado.';
          errorEl.classList.add('alert--visible');
          btn.disabled    = false;
          btn.textContent = 'Guardar contraseña';
        }
      } catch {
        const errorEl = document.getElementById('alert-error');
        errorEl.textContent = 'Error de conexión. Comprueba tu red e inténtalo de nuevo.';
        errorEl.classList.add('alert--visible');
        btn.disabled    = false;
        btn.textContent = 'Guardar contraseña';
      }
    });
  </script>
</body>
</html>
